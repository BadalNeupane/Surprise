<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3,#ff4d6d);
    overflow:hidden;
    font-family:Arial,sans-serif;
}

.container{
    text-align:center;
    color:white;
    animation:fadeIn 2s;
}

h1{
    font-size:70px;
}

h2{
    font-size:45px;
    margin-top:20px;
}

p{
    margin-top:20px;
    font-size:22px;
}

button{
    margin-top:50px;
    padding:18px 45px;
    font-size:22px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    background:white;
    color:#ff1493;
    transition:.3s;
}

button:hover{
    transform:scale(1.1);
}

.heart{
    position:absolute;
    font-size:25px;
    animation:float 8s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:0;
    }
    to{
        transform:translateY(-120vh);
        opacity:1;
    }
}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}
</style>

</head>

<body>

<div class="container">
    <h1>💖</h1>
    <h2>Welcome My Love</h2>
    <p>Every moment with you is my favorite memory.</p>

    <button onclick="startStory()">
        Begin Our Story ❤️
    </button>
</div>

<script>

for(let i=0;i<30;i++){

    let heart=document.createElement("div");

    heart.className="heart";

    heart.innerHTML="💕";

    heart.style.left=Math.random()*100+"vw";

    heart.style.animationDuration=(Math.random()*5+5)+"s";

    heart.style.fontSize=(Math.random()*20+20)+"px";

    document.body.appendChild(heart);

}

function startStory(){

    window.location.href="welcome.html";

}

</script>

</body>
</html>
